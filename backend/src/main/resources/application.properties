# ============================================================================
# Chronos Fire - Backend
# Configuración de Spring Boot
# Base objetivo: chronos_fire en PostgreSQL 17 (127.0.0.1:5432)
# ============================================================================

# Servidor
server.port=${SERVER_PORT:8080}

# Aplicación
spring.application.name=chronos-fire-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/chronos_fire}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS (frontend local)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080}
