# ============================================================================
# Chronos Fire - Backend
# Configuracion de Spring Boot
# Base objetivo: chronos_fire en PostgreSQL 17 (127.0.0.1:5432)
# ============================================================================

# Servidor
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Aplicacion
spring.application.name=chronos-fire-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/chronos_fire}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# JSON: incluir nulls para respetar el contrato (null != 0)
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

# CORS (frontend local)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:8080}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.chronosfire=INFO
logging.level.org.springframework.jdbc.core=WARN
