openapi: 3.0.3
info:
  title: Chronos Fire API
  version: v1
  description: |
    API de solo lectura sobre PostgreSQL `chronos_fire`.
    Fuente de verdad: detecciones FIRMS armonizadas (MODIS C6.1,
    VIIRS SNPP, NOAA-20 y NOAA-21).
    El backend no escribe en la base: solo SELECT.
servers:
  - url: http://127.0.0.1:8080
    description: Local
tags:
  - name: Salud
  - name: Metadatos
  - name: Calendario
  - name: Alertas
  - name: Detecciones
  - name: AOIs
  - name: Validacion
paths:
  /api/health:
    get:
      tags: [Salud]
      operationId: getHealth
      summary: Estado del backend y de PostgreSQL
      responses:
        '200':
          description: Backend y base disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Base no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/meta:
    get:
      tags: [Metadatos]
      operationId: getMeta
      summary: Cobertura, sensores, conteos, definiciones y limitaciones
      responses:
        '200':
          description: Metadatos del archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'

  /api/calendar/weekly:
    get:
      tags: [Calendario]
      operationId: getWeeklyCalendar
      summary: Actividad semanal por AOI, con baseline y anomalia
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Week'
        - $ref: '#/components/parameters/AnomalySensor'
      responses:
        '200':
          description: Resultado semanal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/calendar/daily:
    get:
      tags: [Calendario]
      operationId: getDailyCalendar
      summary: Serie diaria de celdas con actividad y hotspots
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Filas diarias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyRow'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/calendar/heatmap:
    get:
      tags: [Calendario]
      operationId: getHeatmap
      summary: Celdas de 0,05 grados con hotspots por sensor
      description: |
        `hotspots` cuenta detecciones de vegetacion efectiva, confianza
        nominal/alta y fuera de la mascara industrial. `hotspotsBySensor`
        conserva el desglose y no debe presentarse como un promedio.
        `nDetections` sigue siendo el conteo crudo all-sensor de la celda.

        `fireProbability` agrega `fire_years` y `ref_years` de las semanas ISO
        del rango y recalcula `p = (k + alpha) / (n + alpha + beta)`; el
        intervalo es Wilson 90 % sobre el `k/n` agregado. `anomaly` pasa a ser
        `fireProbability` relativo a la tasa AOI de las mismas semanas, en la
        misma escala. Es frecuencia historica, **no prediccion ni riesgo
        oficial**. La era se resuelve como `AUTO` sobre la fecha final del
        rango; NOAA-20/21 no tienen tabla de riesgo.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Celdas agregadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapCell'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/calendar/monthly:
    get:
      tags: [Calendario]
      operationId: getMonthlyCalendar
      summary: Agregacion mensual con celdas y hotspots
      description: |
        `fireCells`, `fireDays`, `hotspots` y `hotspotsBySensor` se filtran por
        `sensor` cuando no es `ALL`. `fire_day` sigue siendo all-sensor:
        `fireCells(sensor)` cuenta celdas con actividad en dias en que ese
        sensor tuvo al menos una deteccion. `hotspots` cuenta detecciones de
        vegetacion efectiva, confianza nominal/alta y fuera de la mascara
        industrial; no es cantidad de incendios. `ALL` no es un promedio; la
        serie esta dominada por VIIRS.

        `baselineFireCells` es la mediana leave-one-out de la misma metrica y
        era del sensor: MODIS 2003-2011, SNPP 2013-2025, NOAA-20 2019-2025,
        NOAA-21 2024-2025. Para `ALL` se excluyen 2000-2002, 2012 y 2026.
        `anomaly` es `fireCells / baselineFireCells` y queda `null` cuando
        `confidence = insufficient`.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/MonthlySensor'
      responses:
        '200':
          description: Meses agregados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyCell'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/calendar/trend:
    get:
      tags: [Calendario]
      operationId: getTrend
      summary: Serie anual con baseline y anomalia
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AnomalySensor'
      responses:
        '200':
          description: Serie anual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrendRow'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/calendar/export.csv:
    get:
      tags: [Calendario]
      operationId: exportCalendarCsv
      summary: Exporta actividad semanal en CSV
      description: |
        CSV semanal por celda y sensor. Devuelve `X-Row-Limit`,
        `X-Returned-Rows` y `X-Truncated` para que el cliente avise si la
        descarga se corto en el tope de 50.000 filas.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
      responses:
        '200':
          description: CSV
          headers:
            X-Row-Limit:
              description: Tope de filas aplicado.
              schema:
                type: integer
            X-Returned-Rows:
              description: Filas incluidas en la respuesta.
              schema:
                type: integer
            X-Truncated:
              description: true si habia mas filas que el tope.
              schema:
                type: boolean
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/alerts:
    get:
      tags: [Alertas]
      operationId: getAlerts
      summary: Alertas NRT agrupadas por celda
      description: |
        Campos de probabilidad **aditivos y nullable**: `fireProbability`,
        `probabilityLow`, `probabilityHigh`, `probabilityRefYears`,
        `probabilityReliability` y `activityPercentile`.

        Formula: `p = (k + alpha) / (n + alpha + beta)` con `k` = anios de
        referencia con fuego y `n` = anios con cobertura
        (`coverage_type = proxy`, regional). `n` es una **cota inferior**: una
        celda nublada puede tener `fire_days = 0` sin estar libre de fuego.
        `activityPercentile` solo es valido con `days = 7`.

        `level` combina recurrencia y anomalia (umbrales provisionales hasta
        la calibracion de la fase 4):

        - `warning`: `p >= 0,50`; o percentil >= 0,90 con
          (`p >= 0,10` o al menos 10 detecciones observadas).
        - `watch`: `p >= 0,25`; o percentil >= 0,75 con
          (`p >= 0,10` o al menos 3 detecciones observadas).
        - `info`: el resto. Con `probabilityReliability = insufficient`
          siempre es `info` y `p` es `null`.

        El percentil solo escala el nivel si la celda-semana tiene base
        historica (`p >= 0,10`) o si el evento tiene volumen suficiente: asi
        un evento intenso y sin precedente no queda sepultado por el
        historico. Con `days != 7` no hay percentil y se usa el volumen
        (>= 10 `warning`, >= 3 `watch`).

        Advertencia: es frecuencia historica estimada, **no prediccion ni
        riesgo oficial**.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/alerts/geojson:
    get:
      tags: [Alertas]
      operationId: getAlertsGeoJson
      summary: Alertas como FeatureCollection
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: GeoJSON
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'

  /api/detections:
    get:
      tags: [Detecciones]
      operationId: getDetections
      summary: Detecciones paginadas
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
        - $ref: '#/components/parameters/Confidence'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Vegetation'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pagina de detecciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/detections/geojson:
    get:
      tags: [Detecciones]
      operationId: getDetectionsGeoJson
      summary: Detecciones como FeatureCollection
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: GeoJSON
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'

  /api/detections/export.csv:
    get:
      tags: [Detecciones]
      operationId: exportDetectionsCsv
      summary: Exporta detecciones o hotspots en CSV
      description: |
        CSV UTF-8 con BOM. Para descargar los hotspots armonizados, usar
        `vegetation=true`, `confidence=nominal`, `confidence=high` y
        `limit=50000`: vegetacion efectiva, confianza nominal/alta y sin focos
        industriales. Maximo 50.000 filas y rango de hasta 10.000 dias.
        Devuelve `X-Row-Limit`, `X-Returned-Rows` y `X-Truncated`.
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Sensor'
        - $ref: '#/components/parameters/Confidence'
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Vegetation'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: CSV
          headers:
            X-Row-Limit:
              description: Tope de filas aplicado.
              schema:
                type: integer
            X-Returned-Rows:
              description: Filas incluidas en la respuesta.
              schema:
                type: integer
            X-Truncated:
              description: true si habia mas filas que el tope.
              schema:
                type: boolean
          content:
            text/csv:
              schema:
                type: string

  /api/aois:
    get:
      tags: [AOIs]
      operationId: getAois
      summary: Catalogo de AOIs
      responses:
        '200':
          description: AOIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aoi'

  /api/validation:
    get:
      tags: [Validacion]
      operationId: getValidation
      summary: Eventos conocidos y sus metricas
      responses:
        '200':
          description: Validacion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationEvent'

components:
  parameters:
    Bbox:
      name: bbox
      in: query
      description: 'oeste,sur,este,norte en grados'
      required: false
      schema:
        type: string
        example: '-61,-34,-59.5,-32.5'
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    Year:
      name: year
      in: query
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 2026
    Week:
      name: week
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 53
    AnomalySensor:
      name: sensor
      in: query
      required: false
      description: |
        AUTO usa MODIS 2003-2011 y VIIRS SNPP 2013-2026.
        ALL no es valido para la anomalia semanal.
      schema:
        type: string
        enum: [AUTO, MODIS, VIIRS_SNPP, VIIRS_NOAA20, VIIRS_NOAA21]
        default: AUTO
    Sensor:
      name: sensor
      in: query
      required: false
      schema:
        type: string
        enum: [AUTO, ALL, MODIS, VIIRS_SNPP, VIIRS_NOAA20, VIIRS_NOAA21]
        default: ALL
    MonthlySensor:
      name: sensor
      in: query
      required: false
      description: |
        Filtra `fireCells`, `fireDays`, `nDetections` y `detectionsBySensor`.
        `fire_day` es all-sensor: el valor por sensor significa "celdas con
        actividad en dias con deteccion de ese sensor", no atribucion exclusiva.
        `AUTO` se trata como `ALL` en este endpoint.
      schema:
        type: string
        enum: [AUTO, ALL, MODIS, VIIRS_SNPP, VIIRS_NOAA20, VIIRS_NOAA21]
        default: ALL
    Confidence:
      name: confidence
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [low, nominal, high]
    Source:
      name: source
      in: query
      required: false
      schema:
        type: string
        enum: [SP, NRT]
    Type:
      name: type
      in: query
      required: false
      schema:
        type: integer
        enum: [0, 1, 2, 3]
    Vegetation:
      name: vegetation
      in: query
      required: false
      schema:
        type: boolean
    Days:
      name: days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 30
        default: 7
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50000
        default: 1000
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, database, latencyMs]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: boolean
        databaseVersion:
          type: string
          nullable: true
        latencyMs:
          type: integer
          format: int64
        lastDetectionAt:
          type: string
          format: date-time
          nullable: true
        detectionsApprox:
          type: integer
          format: int64

    MetaResponse:
      type: object
      properties:
        version:
          type: string
        generatedAt:
          type: string
          format: date-time
        lastDetectionAt:
          type: string
          format: date-time
          nullable: true
        database:
          type: string
        gridResolutionDeg:
          type: number
          format: double
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorCoverage'
        sources:
          type: array
          items:
            type: string
        dateRange:
          $ref: '#/components/schemas/DateRange'
        counts:
          $ref: '#/components/schemas/Counts'
        metricDefinitions:
          type: object
          additionalProperties:
            type: string
        limitations:
          type: array
          items:
            type: string
        attribution:
          type: string
        provisional:
          $ref: '#/components/schemas/ProvisionalWindow'
        risk:
          allOf:
            - $ref: '#/components/schemas/RiskMethodology'
          nullable: true
          description: |
            Calibracion publicada de la capa de riesgo (fase 4). `null` si el
            backtest no se corrio o si el dump no trae las tablas de riesgo.

    SensorCoverage:
      type: object
      properties:
        sensor:
          type: string
        source:
          type: string
        rows:
          type: integer
          format: int64
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    DateRange:
      type: object
      properties:
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true

    Counts:
      type: object
      properties:
        detections:
          type: integer
          format: int64
        gridDaily:
          type: integer
          format: int64
        gridWeekly:
          type: integer
          format: int64
        gridWeeklySensor:
          type: integer
          format: int64
        calendarWeekly:
          type: integer
          format: int64
        industrialCells:
          type: integer
          format: int64
        coverageDaily:
          type: integer
          format: int64
        validationAois:
          type: integer
          format: int64

    ProvisionalWindow:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        reason:
          type: string

    RiskMethodology:
      type: object
      description: |
        Calibracion de la probabilidad historica por celda-semana. Holdout
        temporal (entrenar hasta 2024, evaluar 2025). Si `BSS < 0,05` se
        publica como `risk-v1-low` y la UI lo declara; no se promete
        calibracion que no se midio.
      properties:
        modelVersion:
          type: string
          description: Version publicada, por ejemplo `risk-v1-low`.
        calibrationStatus:
          type: string
          enum: [high, low]
        holdoutYear:
          type: integer
          nullable: true
        brier:
          type: number
          nullable: true
        bss:
          type: number
          nullable: true
          description: Brier Skill Score contra la tasa AOI de la semana (`mu_w`).
        auc:
          type: number
          nullable: true
        cellsWeek:
          type: integer
          format: int64
          nullable: true
          description: Celdas-semana evaluadas en el holdout.
        stabilityBss:
          type: number
          nullable: true
          description: BSS de la ventana corta 2019-2024, como control de estabilidad.
        bssThreshold:
          type: number
          description: Umbral de la puerta de calidad (0,05).
        note:
          type: string

    WeeklyResponse:
      type: object
      properties:
        aoi:
          $ref: '#/components/schemas/BboxObject'
        year:
          type: integer
        week:
          type: integer
        observedFireCells:
          type: integer
        baselineFireCells:
          type: number
          format: double
          nullable: true
        anomaly:
          type: number
          format: double
          nullable: true
        referenceYears:
          type: integer
        referenceWindow:
          type: string
        observedSensor:
          type: string
        baselineSensor:
          type: string
        nCellsAoi:
          type: integer
        confidence:
          type: string
          enum: [high, low, insufficient]
        provisional:
          type: boolean
        dataStatus:
          type: string
          enum: [observed, no_data, unknown]
        nDataYears:
          type: integer
          nullable: true
        fireCellsBySensor:
          type: object
          additionalProperties:
            type: integer
        detectionsBySensor:
          type: object
          additionalProperties:
            type: integer
        frpBySensor:
          type: object
          additionalProperties:
            type: number
        fireDayRateGivenDetection:
          type: number
          format: double
          nullable: true

    BboxObject:
      type: object
      properties:
        minLon:
          type: number
        minLat:
          type: number
        maxLon:
          type: number
        maxLat:
          type: number

    DailyRow:
      type: object
      properties:
        date:
          type: string
          format: date
        gridId:
          type: string
        cellLat:
          type: number
        cellLon:
          type: number
        fireDay:
          type: boolean
        nDetections:
          type: integer
        sensors:
          type: array
          items:
            type: string
        hotspots:
          type: integer
          description: |
            Detecciones de vegetacion efectiva, confianza nominal/alta y fuera
            de la mascara industrial. No es cantidad de incendios.
        hotspotsBySensor:
          type: object
          additionalProperties:
            type: integer
          description: Conteo por sensor; no sumar entre sensores como promedio.
        frpMaxMw:
          type: number
          nullable: true
        frpDensityMaxWm2:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
        dataStatus:
          type: string

    HeatmapCell:
      type: object
      properties:
        gridId:
          type: string
        cellLat:
          type: number
        cellLon:
          type: number
        fireCells:
          type: integer
        fireDays:
          type: integer
        nDetections:
          type: integer
        hotspots:
          type: integer
          description: |
            Detecciones de vegetacion efectiva, confianza nominal/alta y fuera
            de la mascara industrial. No es cantidad de incendios.
        hotspotsBySensor:
          type: object
          additionalProperties:
            type: integer
          description: Conteo por sensor; no sumar entre sensores como promedio.
        anomaly:
          type: number
          nullable: true
          description: |
            `fireProbability` de la celda dividido por la tasa AOI de las
            mismas semanas ISO (misma escala). `null` sin respaldo historico.
        dataStatus:
          type: string
        fireProbability:
          type: number
          nullable: true
          description: |
            Probabilidad historica del rango consultado. Suma `fire_years` y
            `ref_years` de las semanas ISO incluidas y recalcula
            `p = (k + alpha) / (n + alpha + beta)`. Frecuencia historica, no
            prediccion ni riesgo oficial. `null` si no hay respaldo.
        probabilityLow:
          type: number
          nullable: true
          description: Wilson 90 % sobre el `k/n` agregado del rango.
        probabilityHigh:
          type: number
          nullable: true
          description: Wilson 90 % sobre el `k/n` agregado del rango.
        probabilityRefYears:
          type: integer
          nullable: true
          description: |
            Minimo de anios de referencia entre las semanas del rango. Se usa
            el minimo, no la suma, para no inflar la confiabilidad.
        probabilityReliability:
          type: string
          enum: [high, low, insufficient]
          description: Derivada del minimo de anios de referencia del rango.

    MonthlyCell:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 0
          maximum: 11
        fireCells:
          type: integer
        fireDays:
          type: integer
        nDetections:
          type: integer
        detectionsBySensor:
          type: object
          additionalProperties:
            type: integer
        hotspots:
          type: integer
          description: |
            Detecciones de vegetacion efectiva, confianza nominal/alta y fuera
            de la mascara industrial. No es cantidad de incendios.
        hotspotsBySensor:
          type: object
          additionalProperties:
            type: integer
          description: Conteo por sensor; no sumar entre sensores como promedio.
        partial:
          type: boolean
        dataStatus:
          type: string
        baselineFireCells:
          type: number
          nullable: true
          description: Mediana leave-one-out de la misma metrica y era del sensor.
        anomaly:
          type: number
          nullable: true
          description: fireCells / baselineFireCells; null si confidence=insufficient.
        referenceYears:
          type: integer
          description: Cantidad de anos completos usados en el baseline.
        confidence:
          type: string
          enum: [high, low, insufficient]

    TrendRow:
      type: object
      properties:
        year:
          type: integer
        fireCells:
          type: integer
        baselineFireCells:
          type: number
          nullable: true
        anomaly:
          type: number
          nullable: true
        referenceYears:
          type: integer
        confidence:
          type: string
        provisional:
          type: boolean
        observedSensor:
          type: string
        baselineSensor:
          type: string

    AlertResponse:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time
        latestAvailable:
          type: string
          format: date-time
          nullable: true
        days:
          type: integer
        aoi:
          $ref: '#/components/schemas/BboxObject'
        count:
          type: integer
        provisional:
          type: boolean
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'

    Alert:
      type: object
      properties:
        cellLat:
          type: number
        cellLon:
          type: number
        lastDetection:
          type: string
          format: date-time
        nDetections:
          type: integer
        frpMaxMw:
          type: number
          nullable: true
        frpDensityMaxWm2:
          type: number
          nullable: true
        sensors:
          type: array
          items:
            type: string
        confidenceMax:
          type: string
        aoiAnomaly:
          type: number
          nullable: true
        level:
          type: string
          enum: [info, watch, warning]
        industrialMasked:
          type: boolean
        fireProbability:
          type: number
          nullable: true
          description: |
            Frecuencia historica estimada de actividad de fuego en la celda
            para la semana ISO consultada:
            `p = (k + alpha) / (n + alpha + beta)`, con `k` = anios de
            referencia con `fire_days > 0` y `n` = anios con cobertura.
            Es una frecuencia historica, **no una prediccion ni riesgo
            oficial**. `null` si `probabilityReliability = insufficient`.
        probabilityLow:
          type: number
          nullable: true
          description: Limite inferior del intervalo de Wilson al 90 % sobre `k/n`.
        probabilityHigh:
          type: number
          nullable: true
          description: Limite superior del intervalo de Wilson al 90 % sobre `k/n`.
        probabilityRefYears:
          type: integer
          nullable: true
          description: |
            `n`: anios de referencia con cobertura (`coverage_type = proxy`).
            Es la cota inferior: la cobertura es regional, no por celda.
            Nunca mostrar `fireProbability` sin este campo.
        probabilityReliability:
          type: string
          enum: [high, low, insufficient]
          description: |
            `high` con `n >= 10`; `low` con `5 <= n < 10`;
            `insufficient` con `n < 5` (la UI muestra `—`).
        activityPercentile:
          type: number
          nullable: true
          description: |
            Fraccion de anios de referencia con `nDetections` semanal menor o
            igual al observado: "cuan inusual es lo observado". Solo se
            calcula si `days = 7`; en otro caso es `null` porque la unidad
            historica es semanal y no se escala.

